services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: medallion
      POSTGRES_USER: medallion
      POSTGRES_PASSWORD: medallion
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medallion -d medallion"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    volumes:
      - kafka_data:/bitnami/kafka

  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://medallion:medallion@postgres:5432/medallion
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RAW_TICKETS_PATH: /app/raw_tickets.csv
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    profiles:
      - tools

  file-discovery:
    build: .
    command: ["python", "-m", "src.services.file_discovery"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://medallion:medallion@postgres:5432/medallion
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RAW_TICKETS_PATH: /app/raw_tickets.csv
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    profiles:
      - workers

  bronze-worker:
    build: .
    command: ["python", "-m", "src.services.bronze_worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://medallion:medallion@postgres:5432/medallion
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    profiles:
      - workers

  silver-worker:
    build: .
    command: ["python", "-m", "src.services.silver_worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://medallion:medallion@postgres:5432/medallion
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    profiles:
      - workers

  agent-worker:
    build: .
    command: ["python", "-m", "src.services.agent_worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://medallion:medallion@postgres:5432/medallion
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    profiles:
      - workers

  gold-worker:
    build: .
    command: ["python", "-m", "src.services.gold_worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://medallion:medallion@postgres:5432/medallion
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    profiles:
      - workers

volumes:
  postgres_data:
  kafka_data:
